<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZTrack — Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/monitor/serial/styles.css" />
  </head>
  <body>
    <div class="bg-atmosphere" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="brand-mark">ZTrack</span>
        <span class="brand-sub">Usuarios</span>
      </div>
      <nav class="top-meta">
        <a class="pill" href="/monitor/serial/">Serial</a>
        <a class="pill" href="/monitor/serial/sesiones.html">Sesiones</a>
        <span id="user-pill" class="pill" data-mode="agente">—</span>
        <button id="btn-logout" class="btn tiny" type="button">Salir</button>
      </nav>
    </header>

    <main class="layout layout-admin">
      <section class="panel">
        <h2>Crear / editar usuario</h2>
        <form id="form-user" class="auth-form">
          <input type="hidden" id="user-id" />
          <div class="grid-2">
            <label class="field"><span>Username</span><input id="f-username" required /></label>
            <label class="field"><span>Nombre</span><input id="f-nombre" required /></label>
          </div>
          <div class="grid-2">
            <label class="field"><span>Email</span><input id="f-email" type="email" /></label>
            <label class="field">
              <span>Rol</span>
              <select id="f-rol">
                <option value="operador">operador</option>
                <option value="superusuario">superusuario</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span>Contraseña <small id="pass-hint">(requerida al crear)</small></span>
            <input id="f-password" type="password" autocomplete="new-password" />
          </label>
          <div class="actions">
            <button class="btn primary" type="submit">Guardar</button>
            <button class="btn ghost" type="button" id="btn-reset">Limpiar</button>
          </div>
          <p id="form-msg" class="mensaje" data-kind="sys"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Listado</h2>
        <div class="table-wrap">
          <table class="data-table" id="tabla-users">
            <thead>
              <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/monitor/serial/js/usuarios_page.js"></script>
  </body>
</html>
