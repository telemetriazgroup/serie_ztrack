# ZTrack Serie — reverse proxy HTTPS en ztrack.app
# Coloca este fragmento en el VirtualHost SSL de ztrack.app
#
# Entrada UI:  https://ztrack.app/serial/login.html
# API:         https://ztrack.app/monitor/auth/login
# Contenedor:  http://161.132.53.51:9490/monitor/...

ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# --- UI (HTML/CSS/JS) ---
# /serial/*  →  contenedor /monitor/serial/*
ProxyPass        /serial/  http://161.132.53.51:9490/monitor/serial/
ProxyPassReverse /serial/  http://161.132.53.51:9490/monitor/serial/

# --- API (auth, usuarios, sesiones, serie, health) ---
# /monitor/* → contenedor /monitor/*
ProxyPass        /monitor/ http://161.132.53.51:9490/monitor/
ProxyPassReverse /monitor/ http://161.132.53.51:9490/monitor/

# Opcional: redirigir /serial → /serial/
RedirectMatch ^/serial$ /serial/

# ------------------------------------------------------------
# EQUIVALENCIAS (para no perder referencias)
# ------------------------------------------------------------
# Público (HTTPS)                         Backend (9490)
# --------------------------------------  --------------------------------
# /serial/login.html                      /monitor/serial/login.html
# /serial/                                /monitor/serial/
# /serial/styles.css                      /monitor/serial/styles.css
# /serial/js/app.js                       /monitor/serial/js/app.js
# /serial/sesiones.html                   /monitor/serial/sesiones.html
# /serial/usuarios.html                   /monitor/serial/usuarios.html
# /monitor/auth/login                     /monitor/auth/login
# /monitor/auth/me                        /monitor/auth/me
# /monitor/usuarios                       /monitor/usuarios
# /monitor/sesiones-serial/...            /monitor/sesiones-serial/...
# /monitor/serie/generar/{serie}          /monitor/serie/generar/{serie}
# /monitor/health                         /monitor/health
#
# NO uses solo:
#   ProxyPass /serial/ → .../monitor/
# porque entonces login quedaría en /serial/serial/login.html
# y los assets absolutos se romperían más fácil.
