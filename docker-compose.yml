services:
  db:
    image: postgres:16-alpine
    container_name: ztrack_db_serie
    environment:
      POSTGRES_USER: ztrack
      POSTGRES_PASSWORD: ztrack
      POSTGRES_DB: ztrack
    volumes:
      # Mantiene el volumen histórico para no perder datos
      - ztrack_pgdata:/var/lib/postgresql/data
    ports:
      # Host distinto a 5433 (ya usado por otro proyecto ZTrack)
      - "9543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztrack -d ztrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: serie_ztrack-api:latest
    container_name: ztrack_api_serie
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ztrack:ztrack@db:5432/ztrack
      TIMEZONE: America/Lima
      API_PORT: "9490"
      JWT_SECRET: "${JWT_SECRET:-ztrack-serie-jwt-secret-change-me-2023}"
      SUPERUSER_USERNAME: ztrack
      SUPERUSER_PASSWORD: proyectoztrack2023
      # 1 = HTTPS autofirmado (necesario para Web Serial desde el celular por IP LAN)
      ENABLE_HTTPS: "${ENABLE_HTTPS:-0}"
    ports:
      - "9490:9490"
    volumes:
      - ztrack_certs:/certs
    restart: unless-stopped

volumes:
  ztrack_pgdata:
  ztrack_certs:
